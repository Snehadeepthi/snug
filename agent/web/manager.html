<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snug: Store manager</title><link rel="icon" href="logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">
  <div class="pagebar">
    <a class="brand" href="./"><img src="logo.svg" alt="" width="34"><b>snug</b>&nbsp;<span class="muted">store manager</span></a>
    <select id="store" style="max-width:320px"></select>
  </div>
  <h2>Snug impact · last 24 hours <span class="small muted">(live app activity)</span></h2>
  <div class="impact" id="impact"></div>
  <div class="grid2" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start">
    <div class="panel">
      <h3 style="margin-top:0">Fit signals by style</h3>
      <p class="small muted">From anonymous try-on feedback (recommended size vs size kept). History includes simulated demo data.</p>
      <div id="signals"></div>
    </div>
    <div class="panel">
      <h3 style="margin-top:0">Ask the Insights Agent</h3>
      <div class="suggestions" id="sugg">
        <button>Which styles run small, and what should I restock?</button>
        <button>How much has Snug helped today?</button>
        <button>Any styles with length complaints?</button>
      </div>
      <div id="chat" class="chat" style="min-height:120px"></div>
      <form id="f" class="row" style="margin-top:8px"><input id="q" placeholder="Ask about fit, sizes, stock…"><button class="btn primary" style="flex:0 0 90px;margin:0">Ask</button></form>
    </div>
  </div>
</div>
<script src="js/common.js"></script>
<script>
(async function () {
  const { j, esc, addMsg, createSession, runAgent } = Snug; const $ = (s) => document.querySelector(s);
  const uid = "manager-" + Math.random().toString(36).slice(2, 8); let sid = null, busy = false;
  const c = await j("/api/config");
  $("#store").innerHTML = Snug.storeOptions(c.stores);
  $("#store").value = new URLSearchParams(location.search).get("store") || c.default_store;
  const cls = { "runs small": "small", "runs large": "large", "length issues": "length", "true to size": "ok" };
  async function refresh() {
    const id = $("#store").value;
    const [imp, sig] = await Promise.all([j(`/api/stores/${id}/impact`), j(`/api/insights/fit-signals?store_id=${id}`)]);
    $("#impact").innerHTML = [["tags_scanned", "Tags scanned"], ["wrong_size_tryons_avoided", "Wrong-size try-ons avoided"],
      ["trial_room_trips_saved_est", "Trial-room trips saved (est.)"], ["staff_requests", "Staff requests by agent"], ["trial_rooms_held", "Trial rooms held"]]
      .map(([k, l]) => `<div><b>${imp[k]}</b><span>${l}</span></div>`).join("");
    $("#signals").innerHTML = `<table class="cat"><tr><th>Style</th><th>Signal</th><th>Kept rec.</th><th>Sized up</th><th>Sized down</th><th>n</th></tr>${sig.map((r) =>
      `<tr><td>${esc(r.name)}<br><span class="muted">${esc(r.style_id)} · ${esc(r.category)}</span></td><td><span class="signal ${cls[r.signal]}">${esc(r.signal)}</span></td>
       <td>${r.kept_recommended_pct}%</td><td>${r.sized_up_pct}%</td><td>${r.sized_down_pct}%</td><td>${r.responses}</td></tr>`).join("")}</table>`;
  }
  async function ask(text) {
    if (!text.trim() || busy) return; busy = true;
    addMsg($("#chat"), "user", esc(text)); $("#q").value = "";
    try {
      sid ||= await createSession("insights_agent", uid, { store_id: $("#store").value });
      sid = await runAgent({ app: "insights_agent", uid, sessionId: sid, parts: [{ text }], box: $("#chat"), stateDelta: { store_id: $("#store").value },
                             recreate: () => createSession("insights_agent", uid, { store_id: $("#store").value }) });
    } catch (e) { addMsg($("#chat"), "agent", "Error: " + esc(e.message)); }
    busy = false;
  }
  $("#f").onsubmit = (e) => { e.preventDefault(); ask($("#q").value); };
  $("#sugg").onclick = (e) => { if (e.target.tagName === "BUTTON") ask(e.target.textContent); };
  $("#store").onchange = () => { sid = null; refresh(); };
  refresh(); setInterval(refresh, 5000);
})();
</script>
</body>
</html>
